- id: hmr
  disabled: true

- id: session-telemetry-otel
  disabled: true

# Cloud retains the broad account model catalog. The device Host delegates the
# MiniMax route to its parent process over credential-free IPC.
- id: llm-pi-ai
  disabled: true

- insert:
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'
    - id: artifact-store-fs
      name: '@deepseek-ai/dsh-artifact-store-fs'
      config:
        dshHome: !!js dshHomePath()
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: xiaowei-local-safe
        roots:
          - path: !!js process.env.XIAOWEI_LOCAL_PRESET_ROOT
            trust: system
        includeUserRoot: true
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'
      config:
        nativeOpen: false
    - id: device-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
