appId: com.deepseek-harness.desktop
productName: 小薇
copyright: Copyright (c) 2026 小薇
artifactName: ${productName}-${version}-${arch}.${ext}
icon: src/renderer/features/brand/xiaowei-logo.png

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!**/__tests__/**"
  - "!**/tests/**"

asar: true
# node-pty publishes the reviewed Electron-compatible prebuilds but omits the
# TypeScript sources that electron-builder's npm rebuild path expects.
npmRebuild: false
asarUnpack:
  # Only native loaders need real files. JavaScript remains inside asar;
  # the device runtime is published separately as an extra resource.
  - "node_modules/node-pty/**/*"
  - "node_modules/@koromix/koffi-*/**/*"
  - "node_modules/node-addon-require-builtin-*/**/*"

extraMetadata:
  main: dist/main/main/index.js

extraResources:
  - from: dist/product-config.json
    to: product-config.json
  - from: dist/local-runtime
    to: local-runtime

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

dmg:
  title: ${productName}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  artifactName: ${productName}-${version}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64

publish: null
