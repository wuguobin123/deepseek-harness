# The dsh-workbuddy bundle patch: the multi-user capability layer over
# dsh-base + dsh-headless. Applied after dsh-base's insert; rows here
# override base rows by id, with the profile's own cordis.patch.yml and
# any --patch overlays still to come.
#
# The workbuddy profile is the long-running surface the desktop / web
# clients connect to. Each account.signup creates one row in
# `<dshHome>/identity.sqlite`, fires a 20-CNY welcome bonus to the matching
# wallet row, and provisions one AES-256-GCM-encrypted user-model-key —
# the bootstrap chain lives entirely in the api-proxy host-side glue; the
# services mounted below just expose the seams. Sandbox mode defaults to
# `'e2b'` so any tool-bash invocation routes through the E2B provider when
# the bundle mounts one.

# ── workbuddy persona: multi-user product surface ───────────────────────────

- id: system-prompt
  config:
    persona: >-
      You are the workbuddy assistant. Default to read-only skills; ask before
      invoking business write-side operations. Your working directory is {{cwd}}.

# ── swap dsh-headless's one-shot startup/runner for workbuddy's long-lived ──
# dsh-headless (the second bundle in PROFILE_TEMPLATES.workbuddy) mounts
# `headless-startup` (which `program.error`s on empty argv) and a `headless-runner`
# driven by it. The workbuddy surface is a long-lived HTTP /api carrier —
# `pnpm dsh --profile workbuddy` with no positional argument must keep the
# webserver bound, not fail with "a task is required". Disabling both rows
# leaves the headless core (agent / session / llm) intact; only its one-shot
# runner and CLI arg-validator go away.

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

# ── disable HMR for the long-running multi-user surface ──────────────────────
# dsh-base enables the `hmr` plugin which restarts the agent on file
# changes. Multi-user sessions must not silently lose sessions; restarts
# also tear down the bound HTTP socket.

- id: hmr
  disabled: true

# ── account / wallet / model-keys / artifact services ───────────────────────
# Each service owns one SQLite file under DSH_HOME. Single-file-per-capability
# keeps backup granularity and lifecycle independent.

- insert:
    # 1. Storage layers (needed by session-persistence-sqlite and friends).
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js "dshHomePath('storages')"

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # 2. Identity seam (single SQLite file under DSH_HOME).
    - id: identity
      name: '@deepseek-ai/dsh-account-identity'
      config:
        path: !!js "dshHomePath('identity.sqlite')"
        sessionTtlSeconds: !!js "Number(process.env.WORKBUDDY_SESSION_TTL_SECONDS ?? 86400)"
        bootstrap:
          email: !!js "process.env.WORKBUDDY_ADMIN_EMAIL ?? ''"
          password: !!js "process.env.WORKBUDDY_ADMIN_PASSWORD ?? ''"
          displayName: !!js "process.env.WORKBUDDY_ADMIN_DISPLAY_NAME ?? ''"

    # 3. Email verification codes (TTL / cooldown / lockout).
    - id: email-verification
      name: '@deepseek-ai/dsh-account-email-verification'
      config:
        path: !!js "dshHomePath('email-verification.sqlite')"
        enabled: !!js "process.env.WORKBUDDY_EMAIL_VERIFICATION !== 'false'"
        ttlSeconds: !!js "Number(process.env.WORKBUDDY_CODE_TTL_SECONDS ?? 600)"
        resendCooldownSeconds: !!js "Number(process.env.WORKBUDDY_RESEND_COOLDOWN_SECONDS ?? 60)"
        maxSendsPerHour: !!js "Number(process.env.WORKBUDDY_MAX_SENDS_PER_HOUR ?? 10)"
        maxAttemptsBeforeLock: !!js "Number(process.env.WORKBUDDY_MAX_ATTEMPTS ?? 5)"
        lockoutSeconds: !!js "Number(process.env.WORKBUDDY_LOCKOUT_SECONDS ?? 1800)"
        # !!js scalars MUST be double-quoted when the JS expression body
        # contains `:` followed by whitespace — YAML otherwise reads it as a
        # mapping key/value separator and the whole row collapses into
        # {"[object Object]": ...}. See PR #2 Agent Note for the parsing
        # rationale.
        transportKind: !!js "(process.env.WORKBUDDY_SMTP_HOST ? 'smtp' : 'logging')"
        smtpHost: !!js "process.env.WORKBUDDY_SMTP_HOST ?? ''"
        smtpPort: !!js "Number(process.env.WORKBUDDY_SMTP_PORT ?? 465)"
        smtpSecure: !!js "process.env.WORKBUDDY_SMTP_SECURE !== 'false'"
        smtpUsername: !!js "process.env.WORKBUDDY_SMTP_USER ?? ''"
        smtpPassword: !!js "process.env.WORKBUDDY_SMTP_PASSWORD ?? ''"
        smtpFromAddress: !!js "process.env.WORKBUDDY_SMTP_FROM ?? ''"
        smtpTimeoutSeconds: 10

    # 4. Wallet (per-user balance in micros). 20-CNY welcome bonus + 5-CNY
    # daily refresh default; both overridable via env.
    - id: wallet
      name: '@deepseek-ai/dsh-account-wallet'
      config:
        path: !!js "dshHomePath('wallet.sqlite')"
        welcomeBonusMicros: !!js "Number(process.env.WORKBUDDY_WELCOME_BONUS_MICROS ?? 20_000_000)"
        dailyRefreshMicros: !!js "Number(process.env.WORKBUDDY_DAILY_REFRESH_MICROS ?? 5_000_000)"

    # 5. User-model-keys (AES-256-GCM, 32-byte master key from env).
    - id: user-model-keys
      name: '@deepseek-ai/dsh-account-model-keys'
      config:
        path: !!js "dshHomePath('user-model-keys.sqlite')"
        masterKey: !!js "process.env.WORKBUDDY_MASTER_KEY ?? ''"
        keyTtlDays: !!js "Number(process.env.WORKBUDDY_KEY_TTL_DAYS ?? 3650)"

    # 6. Artifact registry (content-addressed on disk; sha256-keyed).
    - id: artifact-store-fs
      name: '@deepseek-ai/dsh-artifact-store-fs'
      config:
        dshHome: !!js "process.env.DSH_HOME ?? ''"

    # 7. The api-proxy (apigateway + account/wallet/modelKeys/artifact wire).
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    # 8. HTTP/WS carrier that binds /api and the SSE downlinks.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        maxRequestBodyBytes: 314572800
        # Loopback covers direct host calls and the desktop client through
        # nginx at :18080 → :18000. Production deployments override via
        # `WORKBUDDY_TRUSTED_HOSTS` (comma-separated).
        trustedHosts: !!js "(process.env.WORKBUDDY_TRUSTED_HOSTS ?? '127.0.0.1,localhost').split(',').map(s => s.trim()).filter(Boolean)"

    # 9. webserver (long-running HTTP / SSE binding).
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: !!js "process.env.WORKBUDDY_HOST ?? '127.0.0.1'"
        port: !!js "Number(process.env.WORKBUDDY_PORT ?? 18000)"

    # 10. SPA fallback (only if the deployment has built the web bundle).
    - id: frontend-static
      name: '@deepseek-ai/dsh-host-frontend-static'
      disabled: !!js "(process.env.WORKBUDDY_SERVE_FRONTEND ?? 'true') === 'false'"
      config:
        distIndex: !!js "process.env.WORKBUDDY_FRONTEND_INDEX ?? (process.cwd() + '/apps/web/dist/index.html')"

    # 11. Startup + runner. The runner is a no-op when no task is given;
    # the HTTP /api endpoint is what serves the desktop clients.
    - id: workbuddy-startup
      name: '@deepseek-ai/dsh-workbuddy/startup'

    - id: workbuddy-runner
      name: '@deepseek-ai/dsh-workbuddy'
      inject: [workbuddyStartup]
      config:
        task: !!js "ctx.workbuddyStartup.task"
