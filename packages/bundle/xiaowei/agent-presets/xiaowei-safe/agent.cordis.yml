# Xiaowei account-safe agent preset. No same-host shell execution, workflow,
# job, or delegated-agent consumers are mounted here. Filesystem consumers are
# restricted to the calling session workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the xiaowei assistant. Your working directory is {{cwd}}.

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    workspaceOnly: true
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
    workspaceOnly: true

- id: tool-html
  name: '@deepseek-ai/dsh-tool-html'
  disabled: !!js "ctx.get('artifactRegistry') === undefined"
- id: tool-slides
  name: '@deepseek-ai/dsh-tool-slides'
  disabled: !!js "ctx.get('artifactRegistry') === undefined"
- id: tool-doc
  name: '@deepseek-ai/dsh-tool-doc'
  disabled: !!js "ctx.get('artifactRegistry') === undefined"
- id: tool-sheet
  name: '@deepseek-ai/dsh-tool-sheet'
  disabled: !!js "ctx.get('artifactRegistry') === undefined || ctx.get('attachments') === undefined"
- id: tool-document
  name: '@deepseek-ai/dsh-tool-document'
  disabled: !!js "ctx.get('attachments') === undefined"
- id: tool-chart
  name: '@deepseek-ai/dsh-tool-chart'
  disabled: !!js "ctx.get('artifactRegistry') === undefined"

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-skill-install
  name: '@deepseek-ai/dsh-tool-skill-install'
  disabled: !!js "ctx.get('accountSkillStore') === undefined"
- id: business-skill-runtime
  name: '@deepseek-ai/dsh-business-runtime'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: You are in plan mode. Stay in plan mode until the plan is approved.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
